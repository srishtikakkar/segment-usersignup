<!DOCTYPE html>
<html>
<head>
    <title>Registration and Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .popup-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0078D4;
            color: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            font-family: sans-serif;
        }
    </style>


   <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(function(OneSignal) {
    OneSignal.init({
      appId: "ee0a36ba-08ba-47d8-97d1-b800f388a57c",
      serviceWorkerPath: "/OneSignalSDK.sw.js",
      serviceWorkerUpdaterPath: "/OneSignalSDKUpdaterWorker.js",
      notifyButton: {
        enable: true
      }
    });
  });
</script>


    
</head>
<body>
    <form id="signup-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <button type="submit">Sign up</button>
    </form>

    <button onclick="location.href='login.html'">Already have an account? Log in</button>
    <button onclick="redirectToExternalSite()">Visit abcsrishtikakkar.net</button>

<script>
    let engage, engageReady = false;
    const INACTIVITY_LIMIT = 45000;
    let inactivityTimer;

    const initEngage = async () => {
        const settings = {
            clientKey: "a93uaptcnc772wJVd4xDahwBX9LUBTAt",
            targetURL: "https://api-engage-us.sitecorecloud.io",
            pointOfSale: "aib.ie",
            cookieDomain: "srishtikakkar.github.io",
            webPersonalization: true
        };
        engage = await window.Engage.init(settings);
        engageReady = true;
        engage.pageView({
            channel: "WEB",
            language: "EN",
            currency: "USD",
            page: window.location.pathname,
            pointOfSale: settings.pointOfSale
        });
    };

    const triggerWebExperience = () => {
        if (!engageReady) return;
        engage.personalize({
            friendlyId: "page_lingering_alert_bar", // your web experience ID
            pointOfSale: "srishti_test",
            channel: "WEB",
            currency: "USD"
        });
    };

    const resetInactivity = () => {
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(triggerWebExperience, INACTIVITY_LIMIT);
    };

    // Setup
    const setupInactivityTracking = () => {
        document.addEventListener("mousemove", resetInactivity);
        document.addEventListener("keydown", resetInactivity);
        document.addEventListener("scroll", resetInactivity);
        resetInactivity(); // Start initial timer
    };

    // Load Engage and start everything
    const engageScript = document.createElement("script");
    engageScript.src = "https://d1mj578wat5n4o.cloudfront.net/sitecore-engage-v.1.4.2.min.js";
    engageScript.onload = () => {
        initEngage().then(() => {
            setupInactivityTracking();
        });
    };
    document.head.appendChild(engageScript);
</script>


    <!-- Signup Form Logic -->
    <script>
        const form = document.querySelector('#signup-form');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.querySelector('#name').value;
            const email = document.querySelector('#email').value;
            const password = document.querySelector('#password').value;

            if (name === '' || email === '' || password === '') {
                alert('Please fill in all the fields');
                return;
            }

            const userId = Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2);
            localStorage.setItem('userId', userId);
            localStorage.setItem('email', email);
            localStorage.setItem('password', password);

            if (engageReady && engage) {
                await engage.identity({
                    identifiers: [{ provider: "email", id: email }],
                    properties: { name: name }
                });

                const eventData = {
                    channel: "WEB",
                    currency: "USD",
                    language: "EN",
                    pointOfSale: "srishti_test",
                    page: window.location.pathname
                };

                const eventExtensionData = {
                    form_id: "signup-form",
                    form_name: "User Registration Form",
                    button_name: "Sign up"
                };

                await engage.event("signup_completed", eventData, eventExtensionData);
            }

            localStorage.setItem("justSignedUp", "true");

            // Redirect after 3 minutes
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 180000);
        });

        function redirectToExternalSite() {
            const anonymousId = localStorage.getItem("userId") || "unknown";
            const queryString = `ajs_aid=${anonymousId}`;
            const url = `http://abcsrishtikakkar.net/?${queryString}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
