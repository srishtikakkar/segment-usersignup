      // Function to extract all URL parameters, specifically looking for UTM parameters
      function getAllUrlParams() {
        var params = {};
        var queryString = window.location.search.substring(1);
        var vars = queryString.split('&');
        for (var i = 0; i < vars.length; i++) {
          var pair = vars[i].split('=');
          // Process all parameters, not just those starting with 'utm_'
          if (typeof params[pair[0]] === 'undefined') {
            params[pair[0]] = decodeURIComponent(pair[1]);
          } else if (typeof params[pair[0]] === 'string') {
            var arr = [params[pair[0]], decodeURIComponent(pair[1])];
            params[pair[0]] = arr;
          } else {
            params[pair[0]].push(decodeURIComponent(pair[1]));
          }
        }
        return params;
      }

      // Extract all parameters
      var allParams = getAllUrlParams();

      // Ensure the analytics library is ready before sending data
      analytics.ready(function() {
        // Modify the analytics.page() call to include all URL parameters
        analytics.page({
          path: window.location.pathname,
          title: document.title,
          url: window.location.href,
          // Pass the extracted parameters as properties
          properties: allParams
        });
      });

   <link rel="stylesheet" href="style.css">
</head>

<body>
   <form id="signup-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name"><br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password"><br><br>
      <button type="submit">Sign up</button>
   </form>

   <button onclick="location.href='login.html'">Already have an account? Log in</button>
   <!-- Button to redirect to abcsrishtikakkar.net in a new tab -->
   <button onclick="redirectToExternalSite()">Visit abcsrishtikakkar.net</button>

   <script>
      // Select the form element
      const form = document.querySelector('#signup-form');

      // Handle the form submission
      form.addEventListener('submit', function (event) {
         event.preventDefault(); // Prevent the default form submission behavior

         // Get the input values
         const name = document.querySelector('#name').value;
         const email = document.querySelector('#email').value;
         const password = document.querySelector('#password').value;
         // Generate a random user ID
         const userId = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);

         // Store the user ID in local storage
         localStorage.setItem('userId', userId);
         localStorage.setItem('email', email);
         localStorage.setItem('password', password);

         console.log(name, email, password);
         // Validate the input values
         if (name === '' || email === '' || password === '') {
            alert('Please fill in all the fields');
            return false;
         }

         analytics.identify(userId, {
            name: name,
            email: email
         });


         analytics.track('Sign Up Completed', {
         });

         // Redirect the user to the login page
         window.location.href = 'login.html';
      });

      // Function to redirect to external site with query string parameters
      function redirectToExternalSite() {
         const anonymousId = analytics.user().anonymousId();

         // Generate the query string parameters
         const queryString = `ajs_aid=${anonymousId}`;

         // Append the query string to the URL
         const url = `http://abcsrishtikakkar.net/?${queryString}`;

         // Open the URL in a new tab
         window.open(url, '_blank');
      }
   </script>
</body>

</html>
