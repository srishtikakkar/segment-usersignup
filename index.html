<!DOCTYPE html>
<html>
<head>
    <title>Registration and Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .popup-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0078D4;
            color: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <form id="signup-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <button type="submit">Sign up</button>
    </form>

    <button onclick="location.href='login.html'">Already have an account? Log in</button>
    <button onclick="redirectToExternalSite()">Visit abcsrishtikakkar.net</button>

    <!-- Engage Script -->
    <script type="text/javascript">
        var engage = undefined;
        var engageReady = false;

        var s = document.createElement("script");
        s.type = "text/javascript";
        s.async = true;
        s.src = "https://d1mj578wat5n4o.cloudfront.net/sitecore-engage-v.1.4.2.min.js";
        var x = document.querySelector("script");
        x.parentNode.insertBefore(s, x);

        s.addEventListener("load", async () => {
            const settings = {
                clientKey: "27a3a79edb7d1ed1786fee1ce8235e2b",
                targetURL: "https://api-engage-us.sitecorecloud.io",
                pointOfSale: "srishti_test",
                cookieDomain: "srishtikakkar.github.io",
                cookieExpiryDays: 365,
                forceServerCookieMode: false,
                includeUTMParameters: true,
                webPersonalization: true
            };

            engage = await window.Engage.init(settings);
            engageReady = true;

            engage.pageView({
                channel: "WEB",
                language: "EN",
                currency: "USD",
                page: window.location.pathname,
                pointOfSale: settings.pointOfSale
            });
        });

        let inactivityTimeout;
        const INACTIVITY_LIMIT = 45000; // 45 seconds
        
        function triggerInteractiveExperience() {
            if (!engageReady || !engage) return;
            
            engage.personalize({
                friendlyId: "page_lingering_alert_bar", // your experience ID
                pointOfSale: "srishti_test",
                channel: "WEB",
                currency: "USD"
            });
        }
        
        
        function resetInactivityTimer() {
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(triggerInteractiveExperience, INACTIVITY_LIMIT);
        }
        
        document.addEventListener("mousemove", resetInactivityTimer);
        document.addEventListener("keydown", resetInactivityTimer);
        document.addEventListener("scroll", resetInactivityTimer);
        resetInactivityTimer();

    </script>

    <!-- Signup Form Logic -->
    <script>
        const form = document.querySelector('#signup-form');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.querySelector('#name').value;
            const email = document.querySelector('#email').value;
            const password = document.querySelector('#password').value;

            if (name === '' || email === '' || password === '') {
                alert('Please fill in all the fields');
                return;
            }

            const userId = Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2);
            localStorage.setItem('userId', userId);
            localStorage.setItem('email', email);
            localStorage.setItem('password', password);

            if (engageReady && engage) {
                await engage.identity({
                    identifiers: [{ provider: "email", id: email }],
                    properties: { name: name }
                });

                const eventData = {
                    channel: "WEB",
                    currency: "USD",
                    language: "EN",
                    pointOfSale: "srishti_test",
                    page: window.location.pathname
                };

                const eventExtensionData = {
                    form_id: "signup-form",
                    form_name: "User Registration Form",
                    button_name: "Sign up"
                };

                await engage.event("signup_completed", eventData, eventExtensionData);
            }

            localStorage.setItem("justSignedUp", "true");

            // Redirect after 3 minutes
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 180000);
        });

        function redirectToExternalSite() {
            const anonymousId = localStorage.getItem("userId") || "unknown";
            const queryString = `ajs_aid=${anonymousId}`;
            const url = `http://abcsrishtikakkar.net/?${queryString}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
